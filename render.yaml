# STAGING blueprint (branch: dev). Production is the `pokemon-arena` service deployed from `main`.
# Create this once in Render: New → Blueprint → this repo → branch `dev` → Apply.
services:
  - type: web
    name: pokemon-arena-dev
    runtime: node
    plan: starter          # $7/mo always-on; change to `free` if you don't mind cold starts on the test site
    region: oregon
    branch: dev
    numInstances: 1
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/stats
    autoDeploy: true       # every push to `dev` redeploys the test site
    envVars:
      - key: NODE_ENV
        value: staging     # not "production" → the dev faucet below is allowed
      - key: NODE_VERSION
        value: "22"
      - key: ARENA_DEV_FAUCET
        value: "1"         # "+10k (dev)" button in the Account panel credits test balance without real tokens
      - key: VAULT_SECRET_KEY   # leave unset on staging: a throwaway vault is generated on the disk below
        sync: false
      - key: SOLANA_RPC
        sync: false
      - key: ADMIN_KEY
        sync: false
    disk:
      name: arena-dev-data
      mountPath: /opt/render/project/src/data   # ledger.json + generated vault.json survive deploys
      sizeGB: 1
