services:
  - type: web
    name: pokemon-arena
    runtime: node
    plan: standard          # paid instance: always-on, no cold starts (use `starter` for the $7 tier)
    region: oregon
    numInstances: 1         # keep at 1 — the arena world lives in memory; more instances would split players
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/stats
    autoDeploy: true
    domains:
      - pokemoncto.com
      - www.pokemoncto.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: VAULT_SECRET_KEY   # base58 or JSON-array secret key of the arena vault wallet (set in the dashboard, never commit it)
        sync: false
      - key: SOLANA_RPC         # optional: a dedicated RPC (Helius/QuickNode) — the public one rate-limits deposit polling
        sync: false
      - key: ADMIN_KEY          # optional: enables GET /api/admin/vault?key=… (vault + ledger summary)
        sync: false
    disk:
      name: arena-data
      mountPath: /opt/render/project/src/data   # persists data/hall-of-fame.json across deploys
      sizeGB: 1
